name: taawanu
description: "تعاونوا — ختمات قرآن جماعية"
publish_to: "none"
version: 1.0.1+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  go_router: ^14.6.0
  google_fonts: ^6.2.1
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  google_sign_in: ^7.2.0
  cloud_functions: ^6.0.0
  url_launcher: ^6.3.3
  shared_preferences: ^2.5.6
  firebase_messaging: ^16.7.1
  geolocator: ^13.0.0
  flutter_compass: ^0.8.1
  hijri: ^3.0.0
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/quran/quran.json
    - assets/quran/madinah.json
    - assets/mushaf/pages.json
    - assets/adhkar/daily.json
    - assets/adhkar/hisn.json
    - assets/fonts/KFGQPC-LICENSE.txt
  fonts:
    # خط مصحف المدينة من مجمع الملك فهد (بدون تعديل، برخصته في assets/fonts/KFGQPC-LICENSE.txt).
    - family: KFGQPC Hafs
      fonts:
        - asset: assets/fonts/KFGQPC-HAFS-Uthmanic-v18.ttf
