name: Prices check (temp)
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: |
          node -e '
          (async () => {
            for (const base of ["https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1", "https://latest.currency-api.pages.dev/v1"]) {
              for (const c of ["xau", "xag"]) {
                try {
                  const r = await fetch(`${base}/currencies/${c}.json`);
                  const d = await r.json();
                  console.log(base, c, d.date, "usd/oz", d[c].usd, "egp/oz", d[c].egp, "egp/g", (d[c].egp/31.1034768).toFixed(2));
                } catch (e) { console.log(base, c, "ERR", e.message); }
              }
            }
          })();'
