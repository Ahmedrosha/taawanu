name: Deploy Firebase

# النشر يدوي بس: من تبويب Actions اختار Deploy Firebase ثم Run workflow.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "اللي هيترفع"
        type: choice
        options: [firestore, functions, hosting, "firestore,functions", "firestore,functions,hosting"]
        default: firestore

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g firebase-tools
      - name: Service account from secrets
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SERVICE_ACCOUNT" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT secret is missing."
            exit 1
          fi
          echo "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
      - name: Apple Team ID in app-link file
        if: contains(inputs.target, 'hosting')
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: sed -i "s/__APPLE_TEAM_ID__/${TEAM_ID}/" site/.well-known/apple-app-site-association
      # خطوط صفحات المجمع لوضع "مطابق للمطبوع" في التطبيق: بتتحوّل لـ ttf وتترفع على taawanu.app/mushaf/qpc2
      - name: Mushaf page fonts
        if: contains(inputs.target, 'hosting')
        run: |
          git clone -q --filter=blob:none --no-checkout https://github.com/zonetecde/mushaf-layout.git "$RUNNER_TEMP/ml"
          cd "$RUNNER_TEMP/ml"
          git checkout -q 421e9eaa991897ecd50d7abb79160651a45976d3 -- fonts/QPC2
          cd "$GITHUB_WORKSPACE"
          pip install --quiet fonttools brotli
          python3 tools/build_mushaf_fonts.py "$RUNNER_TEMP/ml/fonts/QPC2" site/mushaf/qpc2
          echo "::notice title=Mushaf fonts::$(ls site/mushaf/qpc2 | wc -l) files, $(du -sh site/mushaf/qpc2 | cut -f1)"
      - name: Deploy
        run: |
          set +e
          firebase deploy --only "${{ inputs.target }}" --project taawanu-4ca70 --non-interactive --force 2>&1 | tee deploy.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            # آخر سطور الخطأ تظهر في ملخص التشغيل
            msg=$(grep -iE "error|denied|permission|not enabled|failed" deploy.log | tail -8 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=Deploy failed::$msg"
          fi
          exit $code
