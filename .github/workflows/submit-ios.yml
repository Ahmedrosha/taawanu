name: Submit iOS

# يدوي بس: بيجهّز نسخة الآيفون في App Store Connect (النسخة + البناء + نصوص ما الجديد والنص الترويجي).
# بيقدّم للمراجعة بس لو submit = true.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "رقم النسخة (مثلاً 1.0.29)"
        required: true
      build:
        description: "رقم البناء (فاضي = الأحدث)"
        required: false
        default: ""
      submit:
        description: "قدّم للمراجعة؟"
        type: boolean
        default: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare version
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          VERSION: ${{ inputs.version }}
          BUILD: ${{ inputs.build }}
          SUBMIT: ${{ inputs.submit }}
        run: |
          for v in KEY_ID ISSUER_ID PRIVATE_KEY; do
            if [ -z "${!v}" ]; then echo "::error::Missing secret for $v"; exit 1; fi
          done
          KEY_PATH="$RUNNER_TEMP/AuthKey_${KEY_ID}.p8"
          printf '%s\n' "$PRIVATE_KEY" > "$KEY_PATH"
          export KEY_PATH
          python3 -m venv "$RUNNER_TEMP/asc" && "$RUNNER_TEMP/asc/bin/pip" -q install 'pyjwt[crypto]'
          "$RUNNER_TEMP/asc/bin/python" tools/asc_prepare_version.py
          rm -f "$KEY_PATH"
