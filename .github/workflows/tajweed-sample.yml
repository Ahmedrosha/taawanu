name: Tajweed sample (temp)
on:
  workflow_dispatch:
    inputs:
      page:
        default: "50"
jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: |
          mkdir out
          P=${{ inputs.page }}
          curl -fsSL -o out/v4.woff2 "https://verses.quran.foundation/fonts/quran/hafs/v4/colrv1/woff2/p$P.woff2"
          curl -fsSL -o out/v2.woff2 "https://verses.quran.foundation/fonts/quran/hafs/v2/woff2/p$P.woff2"
          ls -la out
          for f in ttf; do curl -sS -o /dev/null -w "v4 $f: %{http_code} %{size_download}\n" "https://verses.quran.foundation/fonts/quran/hafs/v4/colrv1/$f/p$P.$f"; done
          python3 tools/tajweed_sample.py $P out/index.html
          npm init -y >/dev/null && npm i playwright@1.47.2 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          node -e "const {chromium}=require('playwright');(async()=>{const b=await chromium.launch();const p=await b.newPage({viewport:{width:1700,height:900},deviceScaleFactor:2});await p.goto('file://'+process.cwd()+'/out/index.html');await p.waitForTimeout(1500);await p.screenshot({path:'out/sample.png',fullPage:true});await b.close()})()"
      - uses: actions/upload-artifact@v4
        with:
          name: sample
          path: out/sample.png
