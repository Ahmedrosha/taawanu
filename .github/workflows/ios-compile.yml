name: iOS compile check

# يدوي: بيبني الأيفون من غير توقيع ولا رفع، عشان نتأكد إن كود الأيفون (زي الويدجتس) بيتبني قبل بناء النسخة.
# xcode: 26 (الجهاز الحالي Intel) أو 27 (جهاز xcode-27، Apple Silicon على macOS 27) عشان نجرّب متطلب أبريل 2027.
on:
  workflow_dispatch:
    inputs:
      xcode:
        description: "Xcode major (26 or 27)"
        required: false
        default: "26"

jobs:
  compile:
    runs-on: ${{ inputs.xcode == '27' && 'xcode-27' || 'macos-15-intel' }}
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode ${{ inputs.xcode }}
        run: |
          ls -d /Applications/Xcode*.app || true
          X=$(ls -d /Applications/Xcode_${{ inputs.xcode }}*.app /Applications/Xcode-${{ inputs.xcode }}*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X/Contents/Developer"; fi
          xcodebuild -version
          xcodebuild -version | grep -q "Xcode ${{ inputs.xcode }}" || { echo "::error title=Wrong Xcode::Expected Xcode ${{ inputs.xcode }}"; exit 1; }
          xcrun --sdk iphoneos --show-sdk-version
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter build ios --release --no-codesign --config-only > prepare.log 2>&1 || (tail -40 prepare.log; exit 1)
      - name: Build without signing
        run: |
          set -o pipefail
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release \
            -destination 'generic/platform=iOS' build CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log | grep -E "error|BUILD (SUCCEEDED|FAILED)|TaawanuWidgets.appex|Cycle" | cut -c1-400 | tail -60
          grep -q "BUILD SUCCEEDED" build.log
