name: iOS compile check

# يدوي: بيبني الأيفون من غير توقيع ولا رفع، عشان نتأكد إن كود الأيفون (زي الويدجتس) بيتبني قبل بناء النسخة.
on: workflow_dispatch

jobs:
  compile:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$X" ]; then echo "::error title=No Xcode 26::This runner has no Xcode 26"; exit 1; fi
          sudo xcode-select -s "$X/Contents/Developer"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter build ios --release --no-codesign --config-only > prepare.log 2>&1 || (tail -40 prepare.log; exit 1)
      - name: Build without signing
        run: |
          set -o pipefail
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release \
            -destination 'generic/platform=iOS' build CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log | grep -E "error|BUILD (SUCCEEDED|FAILED)|TaawanuWidgets.appex|Cycle" | cut -c1-400 | tail -60
          grep -q "BUILD SUCCEEDED" build.log
