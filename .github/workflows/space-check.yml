name: Space check (temp)
on: workflow_dispatch
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: |
          mkdir -p build
          curl -fsSL -o build/v4.ttf "https://verses.quran.foundation/fonts/quran/hafs/v4/colrv1/ttf/p29.ttf"
          curl -fsSL -o build/v2.ttf "https://taawanu.app/mushaf/qpc2/p029.ttf"
          flutter pub get
          flutter test test/sample/space_test.dart
