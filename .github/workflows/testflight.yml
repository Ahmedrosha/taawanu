name: TestFlight

# يدوي بس: بيبني نسخة الآيفون ويرفعها على TestFlight.
on:
  workflow_dispatch:
    inputs:
      full_build:
        description: "الطريقة القديمة: بناء كامل من غير توقيع قبل الـArchive (أبطأ)"
        type: boolean
        default: false

jobs:
  ios:
    # أجهزة Intel: غالبًا فاضية لما أجهزة Apple Silicon عليها ضغط (البناء أبطأ شوية).
    runs-on: macos-15-intel
    env:
      KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      # أبل بتطلب Xcode 26 أو أحدث للرفع. أجهزة Intel بتشغّل Xcode 16 افتراضي، فبنختار أحدث 26 موجود.
      - name: Select Xcode 26
        run: |
          ls -d /Applications/Xcode*.app
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$X" ]; then echo "::error title=No Xcode 26::This runner has no Xcode 26"; exit 1; fi
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      - name: App Store Connect API key
        env:
          PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          for v in KEY_ID ISSUER_ID TEAM_ID PRIVATE_KEY; do
            if [ -z "${!v}" ]; then echo "::error::Missing secret for $v"; exit 1; fi
          done
          KEY_PATH="$RUNNER_TEMP/AuthKey_${KEY_ID}.p8"
          printf '%s\n' "$PRIVATE_KEY" > "$KEY_PATH"
          echo "KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - run: flutter pub get
      - run: flutter gen-l10n

      # رقم البناء بيزيد تلقائيًا مع كل تشغيل، لأن TestFlight مبيقبلش نفس الرقم مرتين.
      - name: Flutter prepare (config only unless full_build)
        run: |
          set +e
          # الافتراضي: تجهيز المشروع بس (pod install والإعدادات)، والـArchive هو اللي بيبني مرة واحدة.
          flutter build ios --release --no-codesign ${{ inputs.full_build && ' ' || '--config-only' }} --build-number=${{ github.run_number }} > flutter-build.log 2>&1
          code=$?
          tail -40 flutter-build.log
          if [ $code -ne 0 ]; then
            msg=$(grep -iE "error|exception|failed|required|minimum|could not|unable" flutter-build.log | sort -u | tail -8 | cut -c1-300 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::error title=Flutter build failed::$msg"
          fi
          exit $code

      # كل بناء بيعمل شهادة تطوير جديدة، وأبل ليها حد أقصى: بنمسح شهادات "Created via API" قبل وبعد.
      - name: Clean up CI development certificates
        run: |
          python3 -m venv "$RUNNER_TEMP/asc" && "$RUNNER_TEMP/asc/bin/pip" -q install 'pyjwt[crypto]'
          "$RUNNER_TEMP/asc/bin/python" tools/asc_dev_certs.py

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Runner.xcarchive" archive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic 2>&1 | tee archive.log | grep -E "error:|warning: .*sign|ARCHIVE" || true
          if [ ! -d "$RUNNER_TEMP/Runner.xcarchive" ]; then
            msg=$(grep -E "error:" archive.log | sort -u | tail -6 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::error title=Archive failed::$msg"
            exit 1
          fi

      - name: Upload to TestFlight
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          set +e
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID" \
            > export.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            tail -60 export.log
            msg=$(grep -iE "error:|Error Domain|NSLocalizedDescription|NSLocalizedFailureReason|permission|certificate|profile|not authorized|forbidden" export.log | grep -v "^\s*$" | awk '!seen[$0]++' | tail -10 | cut -c1-400 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::error title=Upload failed::$msg"
          else
            echo "::notice title=Uploaded::Build ${{ github.run_number }} uploaded to App Store Connect"
          fi
          exit $code

      - name: Clean up CI development certificates (after)
        if: always()
        run: |
          [ -x "$RUNNER_TEMP/asc/bin/python" ] || { python3 -m venv "$RUNNER_TEMP/asc" && "$RUNNER_TEMP/asc/bin/pip" -q install 'pyjwt[crypto]'; }
          "$RUNNER_TEMP/asc/bin/python" tools/asc_dev_certs.py
