name: CI

# فحص الكود بس (من غير بناء) مع كل push أو pull request.
on:
  push:
  pull_request:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - name: Resolved package versions
        run: |
          for p in firebase_core firebase_auth cloud_firestore cloud_functions google_sign_in go_router google_fonts; do
            v=$(awk -v p="  $p:" '$0==p{f=1} f&&/version:/{gsub(/"/,"",$2); print $2; exit}' pubspec.lock)
            echo "::notice title=$p::$p $v"
          done
      - run: flutter gen-l10n
      - run: flutter analyze
      - name: Tests
        run: |
          if [ -d test ]; then flutter test; else echo "No tests yet"; fi

  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm install -g firebase-tools
      - name: Install test packages
        working-directory: firestore-tests
        run: npm install
      - name: Run rules tests on the emulator
        working-directory: firestore-tests
        run: firebase emulators:exec --only firestore --project demo-taawanu "npm test"

  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - name: Resolved versions
        run: |
          for p in firebase-functions firebase-admin typescript; do
            echo "::notice title=$p::$p $(node -p "require('./node_modules/$p/package.json').version")"
          done
      - name: Build and test
        run: |
          set +e
          npm test > test.log 2>&1
          code=$?
          cat test.log
          if [ $code -ne 0 ]; then
            msg=$(grep -E "error TS|not ok|AssertionError|Error:" test.log | awk '!s[$0]++' | head -8 | cut -c1-300 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::error title=Functions build/test failed::$msg"
          fi
          exit $code
