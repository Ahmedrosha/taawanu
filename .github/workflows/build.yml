name: Build

# البناء يدوي بس: من تبويب Actions اختار Build ثم Run workflow.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: "المنصة"
        type: choice
        options: [android, ios, both]
        default: android

jobs:
  android:
    if: inputs.platform == 'android' || inputs.platform == 'both'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Signing key from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Signing secrets missing; building with the default debug key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload.jks
          {
            echo "storeFile=upload.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
          } > android/key.properties
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: taawanu-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk

  ios:
    if: inputs.platform == 'ios' || inputs.platform == 'both'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter build ios --no-codesign --debug
