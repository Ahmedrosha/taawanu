name: tmp v2 check
on: workflow_dispatch
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for p in 1 29 604; do
            f=$(printf "p%03d.ttf" $p)
            a=$(curl -fsSL "https://verses.quran.foundation/fonts/quran/hafs/v2/ttf/p$p.ttf" | sha256sum | cut -c1-16)
            b=$(curl -fsSL "https://taawanu.app/mushaf/qpc2/$f" | sha256sum | cut -c1-16)
            echo "RESULT p$p qf=$a ours=$b"
          done
          curl -s -o /dev/null -w "RESULT bsml %{http_code}\n" "https://verses.quran.foundation/fonts/quran/hafs/bismillah/bismillah.ttf"
