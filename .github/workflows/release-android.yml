name: Release Android

# يدوي بس: بيبني نسخة Play Store (AAB) موقّعة بمفتاح الرفع.
# رقم النسخة (versionCode) = رقم التشغيل، فبيزيد لوحده كل مرة.
on:
  workflow_dispatch:
    inputs:
      track:
        description: "يترفع على أنهي مسار في Play Console (none = بناء بس)"
        type: choice
        options: [alpha, internal, production, none]
        default: alpha

jobs:
  aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Signing key from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Signing secrets are missing; a Play Store build must be signed with the upload key."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload.jks
          {
            echo "storeFile=upload.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
          } > android/key.properties
      - run: flutter pub get
      - run: flutter gen-l10n
      - name: Build app bundle
        run: |
          set +e
          flutter build appbundle --release --build-number=${{ github.run_number }} > build.log 2>&1
          code=$?
          cat build.log
          if [ $code -ne 0 ]; then
            msg=$(grep -iE "error|failed|exception" build.log | tail -10 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=Build failed::$msg"
          fi
          exit $code
      - name: Version
        run: |
          name=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          echo "::notice title=Built::Version $name (${{ github.run_number }})"
      - uses: actions/upload-artifact@v4
        with:
          name: taawanu-play-${{ github.run_number }}
          path: build/app/outputs/bundle/release/app-release.aab
      # المفتاح لو اتنسخ من الموبايل ممكن سطوره تتكسر؛ بنصلحه قبل الاستخدام.
      - name: Play service account key
        if: inputs.track != 'none'
        env:
          PLAY_KEY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          python3 - <<'PY'
          import json, os
          raw = os.environ.get('PLAY_KEY', '').strip()
          if not raw:
              print('::error::PLAY_SERVICE_ACCOUNT_JSON secret is missing.')
              raise SystemExit(1)
          try:
              key = json.loads(raw, strict=False)
          except Exception as e:
              print(f'::error::PLAY_SERVICE_ACCOUNT_JSON is not valid JSON: {e}')
              raise SystemExit(1)
          path = os.path.join(os.environ['RUNNER_TEMP'], 'play.json')
          with open(path, 'w') as f:
              json.dump(key, f)
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f'PLAY_KEY_FILE={path}\n')
          print('::notice title=Play key::' + key.get('client_email', '?'))
          PY
      - name: Upload to Google Play
        if: inputs.track != 'none'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: ${{ env.PLAY_KEY_FILE }}
          packageName: com.taawanu.taawanu
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          tracks: ${{ inputs.track }}
          status: completed
          whatsNewDirectory: distribution/whatsnew
