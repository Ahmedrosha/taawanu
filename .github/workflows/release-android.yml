name: Release Android

# يدوي بس: بيبني نسخة Play Store (AAB) موقّعة بمفتاح الرفع.
# رقم النسخة (versionCode) = رقم التشغيل، فبيزيد لوحده كل مرة.
on:
  workflow_dispatch:

jobs:
  aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Signing key from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Signing secrets are missing; a Play Store build must be signed with the upload key."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload.jks
          {
            echo "storeFile=upload.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
          } > android/key.properties
      - run: flutter pub get
      - run: flutter gen-l10n
      - name: Build app bundle
        run: |
          set +e
          flutter build appbundle --release --build-number=${{ github.run_number }} > build.log 2>&1
          code=$?
          cat build.log
          if [ $code -ne 0 ]; then
            msg=$(grep -iE "error|failed|exception" build.log | tail -10 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=Build failed::$msg"
          fi
          exit $code
      - name: Version
        run: |
          name=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          echo "::notice title=Built::Version $name (${{ github.run_number }})"
      - uses: actions/upload-artifact@v4
        with:
          name: taawanu-play-${{ github.run_number }}
          path: build/app/outputs/bundle/release/app-release.aab
