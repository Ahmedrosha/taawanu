name: Bootstrap platforms

# بيتشغل يدويًا مرة واحدة: بيولّد مجلدات android و ios ويعملهم commit.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform folders
        run: |
          flutter create --org com.taawanu --project-name taawanu --platforms=android,ios .
          # flutter create بيضيف اختبار تجريبي مش متوافق مع مشروعنا
          rm -f test/widget_test.dart
          rmdir test 2>/dev/null || true
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android ios .metadata
          git commit -m "Generate Android and iOS platform folders" || echo "Nothing to commit"
          git push
