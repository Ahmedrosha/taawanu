name: Fetch reference (temp)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  f:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir o && cd o
          curl -fsSL -o quran-uthmani.txt "https://github.com/cpfair/quran-tajweed/files/7281388/quran-uthmani.txt"
          wc -c quran-uthmani.txt
          git init -q && git checkout -q -b tmp-ref && git add . && git -c user.name=ci -c user.email=ci@local commit -qm ref
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" tmp-ref
