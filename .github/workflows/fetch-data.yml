name: Fetch data

# أداة صغيرة: بتنزّل ملف بيانات من رابط وترفعه كـ artifact (لملفات مصادر القرآن والتفسير).
on:
  workflow_dispatch:
    inputs:
      url:
        description: "الرابط"
        required: true
      name:
        description: "اسم الملف"
        required: true

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download
        run: |
          mkdir out
          curl -fsSL -A "Mozilla/5.0" -o "out/${{ inputs.name }}" "${{ inputs.url }}"
          ls -la out
          echo "::notice title=Fetched::$(wc -c < "out/${{ inputs.name }}") bytes, sha256 $(sha256sum "out/${{ inputs.name }}" | cut -c1-16)"
      # بنحط الملف في فرع لوحده (data-fetch) عشان نقدر ناخده من غير ما يدخل الكود.
      - name: Push to data-fetch branch
        run: |
          cd out
          git init -q -b data-fetch
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -qm "fetched ${{ inputs.name }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data-fetch
