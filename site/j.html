<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>دعوة لمجموعة على تعاونوا</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=Reem+Kufi:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- الصفحة دي بتظهر بس لو التطبيق مش متسطب. لو متسطب، الرابط بيفتحه مباشرة. -->
  <header class="hero">
    <svg width="80" height="80" viewBox="0 0 200 200" role="img" aria-label="لوجو تعاونوا">
      <path id="h" d="M100 84 C80 70 50 64 28 72 Q15 76 19 86 Q12 93 19 103 Q12 110 20 120 Q15 128 24 134 L32 148 C54 140 80 142 100 154 Z" fill="#FFFFFF"/>
      <use href="#h" fill="#BFDBFE" transform="translate(200 0) scale(-1 1)"/>
      <circle cx="100" cy="56" r="9" fill="#D4A537"/>
    </svg>
    <h1>تعاونوا</h1>
    <p>اتدعيت لمجموعة ختمة جماعية</p>
  </header>

  <main class="card">
    <h2>عشان تنضم</h2>
    <ol class="steps">
      <li>نزّل تطبيق تعاونوا على موبايلك.</li>
      <li>ارجع للرسالة وافتح الرابط تاني، هيفتح التطبيق على صفحة المجموعة.</li>
      <li>أو من التطبيق: <strong>مجموعاتي</strong> ← <strong>انضم برابط أو كود</strong>، واكتب الكود ده:</li>
    </ol>
    <p style="text-align:center"><span class="code" id="code">—</span></p>
    <p class="muted">التطبيق قريبًا على App Store وGoogle Play.</p>
  </main>

  <footer class="muted"><a href="/">عن تعاونوا</a> · <a href="/privacy">سياسة الخصوصية</a></footer>

  <script>
    // الكود من آخر الرابط: /j/ABCD2345
    var code = location.pathname.split('/').filter(Boolean).pop() || '';
    if (/^[A-Za-z0-9]{8}$/.test(code)) document.getElementById('code').textContent = code.toUpperCase();
  </script>
</body>
</html>
